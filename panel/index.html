<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Painel do Jarvinho</title>
<style>
:root {
  --bg: #f6f5f1; --surface: #ffffff; --surface-2: #efede7; --line: #dedbd2;
  --ink: #1d1c19; --ink-2: #5d5a52; --ink-3: #8b877c;
  --accent: #2f5bd3;
  --s-ativa: #1f8a4c; --s-pendente: #b7791f; --s-interrompida: #c2412d; --s-pausada: #5b6b82;
  --s-concluida: #2b7a8c; --s-arquivada: #9a968b; --s-agendada: #7a52b3;
  --radius: 10px; --shadow: 0 1px 2px rgba(0,0,0,.05), 0 4px 16px rgba(0,0,0,.04);
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #141412; --surface: #1d1c1a; --surface-2: #262522; --line: #34322e;
    --ink: #eceae4; --ink-2: #b3afa5; --ink-3: #85817a; --accent: #7d9cf0;
    --s-ativa: #4cc17f; --s-pendente: #e3a945; --s-interrompida: #ef7a63; --s-pausada: #93a3bb;
    --s-concluida: #5cb8cb; --s-arquivada: #7d7a73; --s-agendada: #b291e6;
    --shadow: none;
  }
}
:root[data-theme="dark"] {
  --bg: #141412; --surface: #1d1c1a; --surface-2: #262522; --line: #34322e;
  --ink: #eceae4; --ink-2: #b3afa5; --ink-3: #85817a; --accent: #7d9cf0;
  --s-ativa: #4cc17f; --s-pendente: #e3a945; --s-interrompida: #ef7a63; --s-pausada: #93a3bb;
  --s-concluida: #5cb8cb; --s-arquivada: #7d7a73; --s-agendada: #b291e6;
  --shadow: none;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--ink);
  font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
header { position: sticky; top: 0; z-index: 5; background: var(--bg);
  border-bottom: 1px solid var(--line); padding: 14px 16px 10px; }
.top { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; max-width: 1200px; margin: 0 auto; }
h1 { font-size: 20px; margin: 0; letter-spacing: -.01em; }
.updated { color: var(--ink-3); font-size: 12.5px; margin-left: auto; }
.filters { display: flex; gap: 6px; flex-wrap: wrap; max-width: 1200px; margin: 10px auto 0; }
.chip { border: 1px solid var(--line); background: var(--surface); color: var(--ink-2);
  border-radius: 999px; padding: 4px 10px; font-size: 13px; cursor: pointer; display: inline-flex; gap: 6px; align-items: center; }
.chip[aria-pressed="true"] { border-color: var(--ink); color: var(--ink); font-weight: 600; }
.dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex: none; }
main { max-width: 1200px; margin: 0 auto; padding: 16px; }
section h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--ink-3); margin: 6px 0 10px; font-weight: 600; }
.queue { display: grid; gap: 8px; margin-bottom: 22px; }
.decision { background: var(--surface); border: 1px solid var(--line); border-left: 3px solid var(--s-pendente);
  border-radius: var(--radius); padding: 10px 12px; cursor: pointer; box-shadow: var(--shadow); }
.decision .q { font-weight: 600; }
.decision .meta { color: var(--ink-3); font-size: 12.5px; margin-top: 2px; }
.impact { font-family: var(--mono); color: var(--s-pendente); font-weight: 700; margin-right: 6px; }
.grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px;
  cursor: pointer; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 6px; min-width: 0; text-align: left;
  color: inherit; font: inherit; }
.card:hover, .card:focus-visible { border-color: var(--ink-3); outline: none; }
.card .head { display: flex; align-items: center; gap: 8px; }
.card .id { font-weight: 650; font-size: 15.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.card .st { margin-left: auto; font-size: 12px; color: var(--ink-2); white-space: nowrap; }
.card .proj { font-family: var(--mono); font-size: 12px; color: var(--ink-3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.card .obj { color: var(--ink); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.card .reason { font-size: 13px; color: var(--ink-2); }
.card .foot { display: flex; gap: 10px; font-size: 12px; color: var(--ink-3); margin-top: auto; padding-top: 4px; }
.badge { background: var(--s-pendente); color: #fff; border-radius: 999px; padding: 0 7px; font-size: 11.5px; font-weight: 700; }
.empty { color: var(--ink-3); padding: 30px 0; text-align: center; }
/* gaveta de detalhe */
.scrim { position: fixed; inset: 0; background: rgba(0,0,0,.28); opacity: 0; pointer-events: none; transition: opacity .15s; z-index: 9; }
.scrim.open { opacity: 1; pointer-events: auto; }
aside { position: fixed; top: 0; right: 0; bottom: 0; width: min(560px, 100%); background: var(--surface);
  border-left: 1px solid var(--line); transform: translateX(100%); transition: transform .18s ease; z-index: 10;
  display: flex; flex-direction: column; }
aside.open { transform: none; }
aside .bar { display: flex; align-items: center; gap: 10px; padding: 14px 16px; border-bottom: 1px solid var(--line); }
aside .bar h3 { margin: 0; font-size: 17px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.close { margin-left: auto; background: none; border: 1px solid var(--line); color: var(--ink); border-radius: 8px; padding: 4px 10px; cursor: pointer; font: inherit; }
.live { font-size: 12px; color: var(--s-ativa); display: inline-flex; gap: 6px; align-items: center; }
.live .dot { background: var(--s-ativa); animation: pulse 1.6s infinite; }
@keyframes pulse { 50% { opacity: .35; } }
aside .body { overflow-y: auto; padding: 4px 16px 24px; }
aside h4 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--ink-3); margin: 18px 0 8px; }
dl { display: grid; grid-template-columns: max-content 1fr; gap: 4px 14px; margin: 0; font-size: 13.5px; }
dt { color: var(--ink-3); } dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
.mono { font-family: var(--mono); font-size: 12.5px; }
pre.plan { background: var(--surface-2); border-radius: 8px; padding: 10px 12px; white-space: pre-wrap; margin: 0;
  font: 12.5px/1.5 var(--mono); }
.msg { border-left: 2px solid var(--line); padding: 3px 0 3px 10px; margin: 6px 0; font-size: 13.5px; white-space: pre-wrap; overflow-wrap: anywhere; }
.msg.assistant { border-color: var(--accent); }
.msg.tool { border-color: var(--ink-3); font-family: var(--mono); font-size: 12px; color: var(--ink-2); }
.msg .who { font-size: 11px; color: var(--ink-3); display: block; }
.ev { display: grid; grid-template-columns: 64px 1fr; gap: 8px; font-size: 12.5px; padding: 3px 0; border-bottom: 1px dashed var(--line); }
.ev .t { color: var(--ink-3); font-family: var(--mono); }
.copy { display: flex; gap: 6px; align-items: center; }
.copy code { background: var(--surface-2); border-radius: 6px; padding: 3px 7px; font: 12.5px var(--mono); overflow-wrap: anywhere; }
.copy button { border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 6px; padding: 2px 8px; cursor: pointer; font-size: 12px; }
@media (max-width: 560px) { .grid { grid-template-columns: 1fr; } .updated { margin-left: 0; width: 100%; } }
</style>
</head>
<body>
<header>
  <div class="top">
    <h1>Jarvinho</h1>
    <span id="summary" class="updated"></span>
  </div>
  <div class="filters" id="filters" role="toolbar" aria-label="Filtrar por status"></div>
</header>
<main>
  <section id="queueSec" hidden>
    <h2>Fila de decisões</h2>
    <div class="queue" id="queue"></div>
  </section>
  <section>
    <h2>Agentes</h2>
    <div class="grid" id="grid"></div>
  </section>
</main>
<div class="scrim" id="scrim"></div>
<aside id="drawer" aria-hidden="true">
  <div class="bar">
    <span class="dot" id="dDot"></span>
    <h3 id="dTitle"></h3>
    <span class="live" id="dLive" hidden><span class="dot"></span>ao vivo</span>
    <button class="close" id="dClose">Fechar</button>
  </div>
  <div class="body" id="dBody"></div>
</aside>
<script>
const STATIC = /*JV_STATIC*/null;
const STATUS = {
  interrompida: "Interrompida", pendente: "Pendente", ativa: "Ativa", agendada: "Agendada",
  pausada: "Pausada", concluida: "Concluída", arquivada: "Arquivada"
};
const ORDER = Object.keys(STATUS);
let filter = (() => { try { return localStorage.getItem("jv-filter") || "abertos"; } catch { return "abertos"; } })();
let current = null, data = null, openId = null;

const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const color = st => `var(--s-${st})`;
function ago(ts) {
  if (!ts) return "—";
  const s = (Date.now() - new Date(ts).getTime()) / 1000;
  if (s < 90) return `${Math.max(0, Math.round(s))}s`;
  if (s < 5400) return `${Math.round(s / 60)}min`;
  if (s < 172800) return `${Math.round(s / 3600)}h`;
  return `${Math.round(s / 86400)}d`;
}
function when(ts) { return ts ? new Date(ts).toLocaleString("pt-BR", {dateStyle: "short", timeStyle: "short"}) : "—"; }
const base = p => (p || "").split("/").filter(Boolean).pop() || p;

async function load() {
  if (STATIC) { data = STATIC; }
  else {
    try { data = await (await fetch("api/state", {cache: "no-store"})).json(); }
    catch { $("summary").textContent = "sem conexão com o hub"; return; }
  }
  render();
  if (openId) loadDetail(openId);
}

function visible(a) {
  if (filter === "todos") return true;
  if (filter === "abertos") return !["concluida", "arquivada"].includes(a.status);
  return a.status === filter;
}

function render() {
  const counts = {};
  data.agents.forEach(a => counts[a.status] = (counts[a.status] || 0) + 1);
  const open = data.agents.filter(a => !["concluida", "arquivada"].includes(a.status)).length;
  const chips = [["abertos", `Abertos ${open}`], ["todos", `Todos ${data.agents.length}`]]
    .concat(ORDER.filter(s => counts[s]).map(s => [s, `${STATUS[s]} ${counts[s]}`]));
  $("filters").innerHTML = chips.map(([k, label]) =>
    `<button class="chip" data-f="${k}" aria-pressed="${filter === k}">${STATUS[k] ? `<span class="dot" style="background:${color(k)}"></span>` : ""}${esc(label)}</button>`).join("");
  $("summary").textContent = (STATIC ? "foto de " : "atualizado ") + when(data.generated_at);

  const qs = data.decisions || [];
  $("queueSec").hidden = !qs.length;
  $("queue").innerHTML = qs.map(d => {
    const opts = JSON.parse(d.options || "[]");
    return `<div class="decision" data-id="${esc(d.agent_id)}" tabindex="0">
      <div class="q"><span class="impact">${"!".repeat(d.impact)}</span>#${d.id} ${esc(d.question)}</div>
      <div class="meta">${esc(d.agent_id)} · espera há ${ago(d.created_at)}${opts.length ? " · " + opts.map(esc).join(" / ") : ""}</div></div>`;
  }).join("");

  const list = data.agents.filter(visible)
    .sort((a, b) => ORDER.indexOf(a.status) - ORDER.indexOf(b.status) || (b.updated_at || "").localeCompare(a.updated_at || ""));
  $("grid").innerHTML = list.length ? list.map(a => `
    <button class="card" data-id="${esc(a.id)}">
      <div class="head"><span class="dot" style="background:${color(a.status)}"></span>
        <span class="id">${esc(a.id)}</span>
        <span class="st">${STATUS[a.status]}${a.open_decisions ? ` <span class="badge">${a.open_decisions}</span>` : ""}</span></div>
      <div class="proj">${esc(base(a.project_path))}</div>
      <div class="obj">${esc(a.objective)}</div>
      ${a.status_reason ? `<div class="reason">${esc(a.status_reason)}</div>` : ""}
      <div class="foot"><span>criado ${ago(a.created_at)}</span><span>visto há ${ago(a.last_seen_at)}</span></div>
    </button>`).join("") : `<div class="empty">Nenhum agente neste filtro.</div>`;
}

async function loadDetail(id) {
  let d;
  if (STATIC) d = STATIC.details[id];
  else { try { d = await (await fetch("api/agent/" + encodeURIComponent(id), {cache: "no-store"})).json(); } catch { return; } }
  if (!d || openId !== id) return;
  const a = d.agent;
  $("dDot").style.background = color(a.status);
  $("dTitle").textContent = `${a.id} · ${STATUS[a.status]}`;
  $("dLive").hidden = !!STATIC || !["ativa", "pendente"].includes(a.status);
  const attach = a.claude_id ? `claude attach ${a.claude_id}` : "";
  const meta = [
    ["Projeto", `<span class="mono">${esc(a.project_path)}</span>`],
    ["Sessão", `<span class="mono">jv-${esc(a.id)}</span>`],
    ["Abrir", attach ? `<span class="copy"><code>${esc(attach)}</code><button data-copy="${esc(attach)}">copiar</button></span>` : "—"],
    ["Status", `${STATUS[a.status]}${a.status_reason ? " · " + esc(a.status_reason) : ""}`],
    ["Modo", esc(a.permission_mode)],
    ["Criado", when(a.created_at)], ["Iniciado", when(a.started_at)],
    ["Concluído", when(a.completed_at)], ["Arquivado", when(a.archived_at)],
    ["Visto", a.last_seen_at ? `há ${ago(a.last_seen_at)}` : "—"],
    ["Depende de", esc(a.depends_on || "—")],
    ["Session id", `<span class="mono">${esc(a.session_id || "—")}</span>`],
  ];
  const decs = d.decisions.map(x => `<div class="msg ${x.status === "aberta" ? "assistant" : ""}">
      <span class="who">#${x.id} · ${x.status} · impacto ${x.impact} · ${when(x.created_at)}</span>${esc(x.question)}${x.answer ? `\n→ ${esc(x.answer)}` : ""}</div>`).join("");
  const tail = (d.tail || []).map(m => `<div class="msg ${m.role}"><span class="who">${m.role === "tool" ? "ferramenta" : m.role === "assistant" ? "agente" : "entrada"}${m.ts ? " · " + when(m.ts) : ""}</span>${esc(m.text)}</div>`).join("");
  const evs = d.events.map(e => `<div class="ev"><span class="t">${ago(e.ts)}</span><span><b>${esc(e.kind)}</b> ${esc(e.detail)}</span></div>`).join("");
  $("dBody").innerHTML = `
    <h4>Missão</h4><div>${esc(a.objective)}</div>
    ${a.done_criteria ? `<div class="reason" style="margin-top:6px;color:var(--ink-2)"><b>Pronto quando:</b> ${esc(a.done_criteria)}</div>` : ""}
    ${a.summary ? `<h4>Entrega</h4><div>${esc(a.summary)}</div>` : ""}
    <h4>Agora</h4>${tail || (a.last_message ? `<div class="msg assistant">${esc(a.last_message)}</div>` : `<div class="reason">Sem falas ainda.</div>`)}
    <h4>Plano (checkpoint)</h4>${d.plan ? `<pre class="plan">${esc(d.plan)}</pre>` : `<div class="reason">Sem checkpoint ainda.</div>`}
    ${decs ? `<h4>Decisões</h4>${decs}` : ""}
    <h4>Metadados</h4><dl>${meta.map(([k, v]) => `<dt>${k}</dt><dd>${v}</dd>`).join("")}</dl>
    <h4>Eventos</h4>${evs || `<div class="reason">Nenhum.</div>`}`;
}

function openDrawer(id) {
  openId = id; current = id;
  $("drawer").classList.add("open"); $("scrim").classList.add("open");
  $("drawer").setAttribute("aria-hidden", "false");
  $("dBody").innerHTML = ""; loadDetail(id);
}
function closeDrawer() {
  openId = null; $("drawer").classList.remove("open"); $("scrim").classList.remove("open");
  $("drawer").setAttribute("aria-hidden", "true");
}

document.addEventListener("click", e => {
  const chip = e.target.closest(".chip");
  if (chip) { filter = chip.dataset.f; try { localStorage.setItem("jv-filter", filter); } catch {} render(); return; }
  const cp = e.target.closest("[data-copy]");
  if (cp) { navigator.clipboard?.writeText(cp.dataset.copy); cp.textContent = "copiado"; return; }
  const card = e.target.closest(".card, .decision");
  if (card) openDrawer(card.dataset.id);
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape") closeDrawer();
  if (e.key === "Enter" && e.target.classList?.contains("decision")) openDrawer(e.target.dataset.id);
});
$("dClose").onclick = closeDrawer; $("scrim").onclick = closeDrawer;

load();
if (!STATIC) setInterval(load, 3000);
</script>
</body>
</html>
